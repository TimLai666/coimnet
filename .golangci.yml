version: "2"

run:
  timeout: 10m

linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    staticcheck:
      # Correctness checks (SA) only; simplification, naming and style checks
      # (S, ST, QF) are not enforced. SA9004 is off because constant groups
      # here deliberately mix one typed seed with untyped sizes and rates.
      checks:
        - all
        - -ST*
        - -QF*
        - -S1*
        - -SA9004
  exclusions:
    rules:
      # Close and Remove errors are not checked repo-wide yet; see ENG.md
      # Follow-ups before relying on this for files the code writes.
      - linters: [errcheck]
        text: "Error return value of `[^`]*\\.(Close|Remove|RemoveAll)` is not checked"
      # Tests pass a nil Context on purpose to check that it is rejected.
      - linters: [staticcheck]
        path: _test\.go
        text: "SA1012"
